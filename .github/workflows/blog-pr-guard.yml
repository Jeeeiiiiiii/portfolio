name: Blog PR Guard

on:
  pull_request:
    branches: [main]

jobs:
  enforce-path-allowlist:
    name: Only content/blog/*.md may change
    if: startsWith(github.head_ref, 'blog/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare against base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          printf '%s\n' "$changed"
          bad=$(printf '%s\n' "$changed" | grep -v -E '^content/blog/[a-z0-9]+(-[a-z0-9]+)*\.md$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Blog draft PRs may only modify content/blog/*.md. Disallowed changes:"
            printf '%s\n' "$bad"
            exit 1
          fi
